[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "scopemux_core"
version = "0.1.0"
description = "Python bindings for the ScopeMux native core"
readme = "../README.md"
requires-python = ">=3.10"
authors = [
  { name = "ScopeMux" },
]

[tool.scikit-build]
cmake.source-dir = ".."
build-dir = "build/{wheel_tag}"
wheel.packages = []

[tool.scikit-build.cmake.define]
SCOPEMUX_BUILD_TESTS = "OFF"
